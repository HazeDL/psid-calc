<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSID — Калькулятор баллов</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-alt: #161b22;
    --bg-hover: #1c2330;
    --border: #2a3140;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --success: #3fb950;
    --danger: #f85149;
    --gold: #d29922;
    --radius: 10px;
    --shadow: 0 4px 16px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100vh; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 24px 16px 60px;
    position: relative;
    overflow-x: hidden;

    /* фон по умолчанию: плавный градиент */
    background-image: linear-gradient(-45deg, #0a0e14, #0d1117, #101828, #0d1117);
    background-size: 400% 400%;
    background-attachment: fixed;
    animation: gradientShift 22s ease infinite;
    transition: background-color 0.4s ease;
  }

  /* декоративная сетка поверх градиента, но под контентом */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(88, 166, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88, 166, 255, 0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 30s linear infinite;
  }

  /* если пользователь загрузил свой фон — сетку скрываем */
  body.has-custom-bg::before { display: none; }

  body.has-custom-bg {
    background-size: cover !important;
    background-position: center center !important;
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
    animation: none !important;
  }

  /* затемняющая плёнка поверх пользовательского фона */
  body.has-custom-bg::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: rgba(13, 17, 23, 0.72);
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  @keyframes gridMove {
    from { background-position: 0 0; }
    to   { background-position: 50px 50px; }
  }

  .container {
    max-width: 980px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ============================================================
     ЗАГОЛОВОК
     ============================================================ */
  header {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  header p {
    color: var(--text-dim);
    font-size: 14px;
  }

  /* ============================================================
     КНОПКА ФОНА
     ============================================================ */
  .bg-controls {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
  }
  .bg-btn {
    background: var(--bg-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: all 0.15s;
  }
  .bg-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--bg-hover);
  }
  .bg-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    width: 290px;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .bg-menu[hidden] { display: none; }
  .bg-menu-item {
    background: transparent;
    color: var(--text);
    border: none;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    display: block;
    transition: background 0.12s, color 0.12s;
  }
  .bg-menu-item:hover {
    background: var(--bg-hover);
    color: var(--accent);
  }
  .bg-menu-item.danger:hover {
    background: rgba(248, 81, 73, 0.1);
    color: var(--danger);
  }
  .bg-menu-item input[type="color"] {
    width: 100%;
    height: 28px;
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }

  /* ============================================================
     СЕКЦИИ
     ============================================================ */
  .section {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* ============================================================
     СТРОКИ УСЛУГ
     ============================================================ */
  .row {
    display: grid;
    grid-template-columns: 1fr 90px 90px 90px;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    border-radius: 8px;
    transition: background 0.15s;
  }
  .row:not(.header-row):hover {
    background: var(--bg-hover);
  }
  .row.active {
    background: rgba(88, 166, 255, 0.08);
  }
  .header-row {
    color: var(--text-dim);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .header-row .cell { text-align: center; }
  .header-row .cell:first-child { text-align: left; }

  .name {
    font-size: 14px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .name .limit {
    font-size: 11px;
    color: var(--gold);
    background: rgba(210, 153, 34, 0.12);
    padding: 1px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }

  input[type="number"] {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 14px;
    font-family: inherit;
    text-align: center;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
  }
  input[type="number"].over-limit {
    border-color: var(--danger);
    background: rgba(248, 81, 73, 0.08);
  }

  .sum {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    transition: color 0.15s;
  }
  .sum.positive { color: var(--success); }

  /* ============================================================
     ИТОГ
     ============================================================ */
  .total-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, #1a2744 0%, #16213e 100%);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
    box-shadow: 0 0 0 1px rgba(88, 166, 255, 0.1), var(--shadow);
  }
  .total-box .label {
    font-size: 14px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .total-box .value {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    transition: transform 0.15s;
  }
  .total-box .value.pulse {
    transform: scale(1.08);
  }

  /* ============================================================
     КНОПКИ
     ============================================================ */
  .buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  button {
    background: var(--bg-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover {
    background: var(--bg-hover);
    border-color: var(--accent);
    color: var(--accent);
  }
  button:active { transform: translateY(1px); }

  button.primary {
    background: var(--accent);
    color: #0d1117;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #0d1117;
  }
  button.danger:hover {
    background: rgba(248, 81, 73, 0.1);
    border-color: var(--danger);
    color: var(--danger);
  }

  /* ============================================================
     ОТЧЁТ
     ============================================================ */
  .report {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    font-family: "Consolas", "Monaco", "Courier New", monospace;
    font-size: 13px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 120px;
    max-height: 400px;
    overflow-y: auto;
    line-height: 1.6;
  }
  .report:empty::before {
    content: "Отчёт появится здесь после расчёта...";
    color: var(--text-dim);
    font-style: italic;
  }

  /* ============================================================
     TOAST
     ============================================================ */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--bg-alt);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 14px;
    box-shadow: var(--shadow);
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    pointer-events: none;
    z-index: 2000;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ============================================================
     МОБИЛЬНАЯ ВЕРСИЯ
     ============================================================ */
  @media (max-width: 640px) {
    body { padding: 16px 10px 40px; }
    .row {
      grid-template-columns: 1fr 60px 60px 60px;
      gap: 6px;
      padding: 6px 6px;
    }
    .name { font-size: 12.5px; }
    .name .limit { display: none; }
    .total-box .value { font-size: 28px; }
    .total-box { padding: 16px; }
    header h1 { font-size: 22px; }
    header p { font-size: 12.5px; }
    .bg-controls { top: 10px; right: 10px; }
    .bg-btn { padding: 6px 10px; font-size: 12px; }
    .bg-menu { width: 250px; }
    input[type="number"] { padding: 6px 4px; font-size: 13px; }
    .buttons { grid-template-columns: 1fr 1fr; }
    button { padding: 10px 12px; font-size: 13px; }
    .report { font-size: 12px; padding: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    body, body::before { animation: none !important; }
  }
</style>
</head>
<body>

<!-- ============================================================
     КНОПКА ВЫБОРА ФОНА
     ============================================================ -->
<div class="bg-controls">
  <button class="bg-btn" id="bg-menu-btn" type="button">🎨 Фон</button>
  <div class="bg-menu" id="bg-menu" hidden>
    <label class="bg-menu-item">
      📁 Загрузить картинку (PNG, JPG, GIF, WEBP, SVG)
      <input type="file" id="bg-file"
             accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" hidden>
    </label>
    <label class="bg-menu-item">
      🌈 Сплошной цвет
      <input type="color" id="bg-color" value="#0d1117">
    </label>
    <button class="bg-menu-item" id="bg-gradient" type="button">✨ Градиент (по умолчанию)</button>
    <button class="bg-menu-item danger" id="bg-reset" type="button">🗑 Убрать фон</button>
  </div>
</div>

<div class="container">

  <header>
    <h1>PSID — Калькулятор баллов</h1>
    <p>Введите количество — итог пересчитается автоматически</p>
  </header>

  <div class="section">
    <div class="section-title">Основная система баллов</div>
    <div class="row header-row">
      <div class="cell">Услуга</div>
      <div class="cell">Кол-во</div>
      <div class="cell">Балл</div>
      <div class="cell">Итог</div>
    </div>
    <div id="main-items"></div>
  </div>

  <div class="section">
    <div class="section-title">Доп. система — Инструкторы PSID</div>
    <div class="row header-row">
      <div class="cell">Услуга</div>
      <div class="cell">Кол-во</div>
      <div class="cell">Балл</div>
      <div class="cell">Итог</div>
    </div>
    <div id="instr-items"></div>
  </div>

  <div class="total-box">
    <span class="label">Итого баллов</span>
    <span class="value" id="total">0</span>
  </div>

  <div class="buttons">
    <button class="primary" id="btn-copy" type="button">📋 Копировать отчёт</button>
    <button id="btn-csv" type="button">💾 Скачать CSV</button>
    <button id="btn-save" type="button">🔒 Сохранить баллы</button>
    <button class="danger" id="btn-reset" type="button">↺ Сбросить всё</button>
  </div>

  <div class="report" id="report"></div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   СПИСОК УСЛУГ
   key   — ключ
   name  — отображаемое имя
   pts   — балл по умолчанию
   lim   — лимит количества (0 = без лимита)
   sect  — 1 = основная, 2 = инструкторы
   ============================================================ */
const ITEMS = [
  {key:"pill_day",       name:"Выдача таблетки днём",                   pts:2,  lim:100, sect:1},
  {key:"pill_night",     name:"Выдача таблетки ночью",                  pts:2,  lim:100, sect:1},
  {key:"vax_day",        name:"Выдача вакцины днём",                    pts:3,  lim:0,   sect:1},
  {key:"vax_night",      name:"Выдача вакцины ночью",                   pts:4,  lim:0,   sect:1},
  {key:"med_elsh",       name:"Мед. справка в ELSH",                    pts:5,  lim:0,   sect:1},
  {key:"med_ss_pb",      name:"Мед. справка в СШ / Палето-Бей",         pts:6,  lim:0,   sect:1},
  {key:"donor_day",      name:"Присутствие на Дне Донора",              pts:40, lim:0,   sect:1},
  {key:"gov_check",      name:"Проверка гос. организации",              pts:50, lim:0,   sect:1},
  {key:"psy_video",      name:"Псих. помощь с видео-откатом",           pts:50, lim:0,   sect:1},
  {key:"pmp_day",        name:"Оказание ПМП днём",                      pts:3,  lim:3,   sect:1},
  {key:"pmp_night",      name:"Оказание ПМП ночью",                     pts:4,  lim:0,   sect:1},
  {key:"supply",         name:"Участие в поставках",                    pts:30, lim:0,   sect:1},
  {key:"kpz_bank",       name:"Выезд. обследование (КПЗ/Банк/Похитка)", pts:45, lim:0,   sect:1},
  {key:"rp_video",       name:"РП операция с видео-откатом",            pts:50, lim:0,   sect:1},
  {key:"recruit",        name:"Принятие во фракцию (Рекрутер)",         pts:30, lim:0,   sect:1},
  {key:"therapist_qual", name:"Принятие квал-ции Терапевта",            pts:20, lim:0,   sect:1},
  {key:"duty_ss_pb",     name:"Дежурство 30 мин в СШ/ПБ",               pts:20, lim:0,   sect:1},
  {key:"duty_elsh",      name:"Дежурство 30 мин в ELSH",                pts:10, lim:0,   sect:1},
  {key:"instr_weekly",   name:"Проверка недельного отчёта",             pts:20, lim:0,   sect:2},
  {key:"instr_theory",   name:"Принятие внутр. теор. экзамена",         pts:20, lim:0,   sect:2},
  {key:"instr_practice", name:"Внутр. практ. экзамен интерну",          pts:30, lim:0,   sect:2},
  {key:"instr_therapist",name:"Экзамен на квал-цию терапевта",          pts:15, lim:0,   sect:2},
  {key:"instr_psy_rep",  name:"Проверка отчёта о псих. помощи",         pts:30, lim:0,   sect:2},
  {key:"instr_psy_help", name:"Помощь в псих. помощи",                  pts:20, lim:0,   sect:2},
  {key:"instr_gov",      name:"Доп. проверка гос. структур",            pts:20, lim:0,   sect:2},
];

const STORAGE_STATE    = "psid_calc_state_v1";
const STORAGE_DEFAULTS = "psid_calc_defaults_v1";

/* ============================================================
   ГЕНЕРАЦИЯ РАЗМЕТКИ
   ============================================================ */
function renderItems() {
  const mainEl  = document.getElementById("main-items");
  const instrEl = document.getElementById("instr-items");

  ITEMS.forEach(it => {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.key = it.key;

    const limitBadge = it.lim > 0 ? `<span class="limit">макс ${it.lim}</span>` : "";

    row.innerHTML = `
      <div class="name">${it.name}${limitBadge}</div>
      <input type="number" min="0" step="1" placeholder="" data-role="count" data-key="${it.key}">
      <input type="number" min="0" step="1" value="${it.pts}" data-role="point" data-key="${it.key}">
      <div class="sum" data-role="sum" data-key="${it.key}">0</div>
    `;

    if (it.sect === 1) mainEl.appendChild(row);
    else               instrEl.appendChild(row);
  });

  document.querySelectorAll("input[type=number]").forEach(inp => {
    inp.addEventListener("input", recalc);
  });
}

/* ============================================================
   ЧТЕНИЕ ЗНАЧЕНИЙ
   ============================================================ */
function getValue(key, role) {
  const el = document.querySelector(`input[data-role="${role}"][data-key="${key}"]`);
  if (!el) return 0;
  const v = parseInt(el.value, 10);
  return isNaN(v) ? 0 : v;
}

/* ============================================================
   ПЕРЕСЧЁТ
   ============================================================ */
function recalc() {
  let total = 0;
  const details = { main: [], instr: [], mainSum: 0, instrSum: 0 };

  ITEMS.forEach(it => {
    const countEl = document.querySelector(`input[data-role="count"][data-key="${it.key}"]`);
    const sumEl   = document.querySelector(`div[data-role="sum"][data-key="${it.key}"]`);
    let count = getValue(it.key, "count");
    const point = getValue(it.key, "point");

    const overLimit = it.lim > 0 && count > it.lim;
    if (overLimit) count = it.lim;
    countEl.classList.toggle("over-limit", overLimit);

    const sum = count * point;
    total += sum;

    sumEl.textContent = sum;
    sumEl.classList.toggle("positive", sum > 0);

    const row = countEl.closest(".row");
    row.classList.toggle("active", count > 0);

    if (count > 0) {
      const entry = {name: it.name, count, point, sum};
      if (it.sect === 1) { details.main.push(entry);  details.mainSum += sum; }
      else               { details.instr.push(entry); details.instrSum += sum; }
    }
  });

  const totalEl = document.getElementById("total");
  if (parseInt(totalEl.textContent, 10) !== total) {
    totalEl.textContent = total;
    totalEl.classList.add("pulse");
    setTimeout(() => totalEl.classList.remove("pulse"), 200);
  }

  // отчёт
  const reportEl = document.getElementById("report");
  let report = "";
  if (details.main.length) {
    report += "── Основные услуги ──\n";
    details.main.forEach(e => {
      report += `  ${e.name}: ${e.count} × ${e.point} = ${e.sum}\n`;
    });
    report += `  Подытог: ${details.mainSum}\n\n`;
  }
  if (details.instr.length) {
    report += "── Инструкторы ──\n";
    details.instr.forEach(e => {
      report += `  ${e.name}: ${e.count} × ${e.point} = ${e.sum}\n`;
    });
    report += `  Подытог: ${details.instrSum}\n\n`;
  }
  if (total > 0) report += `ИТОГО: ${total} баллов`;
  reportEl.textContent = report;

  saveState();
}

/* ============================================================
   СОХРАНЕНИЕ / ЗАГРУЗКА
   ============================================================ */
function saveState() {
  const state = {};
  ITEMS.forEach(it => {
    state[it.key] = {
      count: getValue(it.key, "count"),
      point: getValue(it.key, "point"),
    };
  });
  try { localStorage.setItem(STORAGE_STATE, JSON.stringify(state)); } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_STATE);
    if (!raw) return;
    const state = JSON.parse(raw);
    ITEMS.forEach(it => {
      if (!state[it.key]) return;
      const c = state[it.key].count || 0;
      const p = state[it.key].point != null ? state[it.key].point : it.pts;
      const cEl = document.querySelector(`input[data-role="count"][data-key="${it.key}"]`);
      const pEl = document.querySelector(`input[data-role="point"][data-key="${it.key}"]`);
      if (cEl) cEl.value = c > 0 ? c : "";
      if (pEl) pEl.value = p;
    });
  } catch (e) {}
}

function loadSavedDefaults() {
  try {
    const raw = localStorage.getItem(STORAGE_DEFAULTS);
    if (!raw) return;
    const defs = JSON.parse(raw);
    ITEMS.forEach(it => {
      if (defs[it.key] != null) {
        const pEl = document.querySelector(`input[data-role="point"][data-key="${it.key}"]`);
        if (pEl) pEl.value = defs[it.key];
      }
    });
  } catch (e) {}
}

/* ============================================================
   ДЕЙСТВИЯ КНОПОК
   ============================================================ */
function resetAll() {
  ITEMS.forEach(it => {
    const cEl = document.querySelector(`input[data-role="count"][data-key="${it.key}"]`);
    const pEl = document.querySelector(`input[data-role="point"][data-key="${it.key}"]`);
    if (cEl) cEl.value = "";
    if (pEl) pEl.value = it.pts;
  });
  recalc();
  toast("Всё сброшено");
}

function saveDefaults() {
  const pts = {};
  ITEMS.forEach(it => { pts[it.key] = getValue(it.key, "point"); });
  try {
    localStorage.setItem(STORAGE_DEFAULTS, JSON.stringify(pts));
    toast("Баллы сохранены как новые по умолчанию");
  } catch (e) {
    toast("Не удалось сохранить");
  }
}

function copyReport() {
  const report = document.getElementById("report").textContent;
  if (!report) { toast("Сначала введите данные"); return; }
  const full = "=== ОТЧЁТ PSID ===\n\n" + report;
  navigator.clipboard.writeText(full)
    .then(() => toast("Отчёт скопирован в буфер"))
    .catch(() => toast("Не удалось скопировать"));
}

function downloadCSV() {
  const rows = [["Услуга", "Кол-во", "Балл", "Итог"]];
  let total = 0;
  ITEMS.forEach(it => {
    let count = getValue(it.key, "count");
    const point = getValue(it.key, "point");
    if (it.lim > 0 && count > it.lim) count = it.lim;
    if (count > 0) {
      const sum = count * point;
      total += sum;
      rows.push([it.name, count, point, sum]);
    }
  });
  rows.push([]);
  rows.push(["", "", "ИТОГО", total]);

  const csv = "\uFEFF" + rows.map(r =>
    r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")
  ).join("\n");

  const blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `psid_report_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("CSV скачан");
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
}

/* ============================================================
   ЗАГРУЗЧИК ФОНА
   ============================================================ */
(function() {
  const KEY = "psid_bg_v1";
  const body = document.body;

  const btnMenu    = document.getElementById("bg-menu-btn");
  const menu       = document.getElementById("bg-menu");
  const inputFile  = document.getElementById("bg-file");
  const inputColor = document.getElementById("bg-color");
  const btnGrad    = document.getElementById("bg-gradient");
  const btnReset   = document.getElementById("bg-reset");

  btnMenu.addEventListener("click", (e) => {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
  });
  document.addEventListener("click", (e) => {
    if (!menu.hidden && !menu.contains(e.target) && e.target !== btnMenu) {
      menu.hidden = true;
    }
  });

  function applyBackground(cfg, persist = true) {
    body.classList.remove("has-custom-bg");
    body.style.backgroundColor = "";
    body.style.backgroundImage = "";

    if (!cfg || cfg.type === "gradient") {
      if (persist) save({type: "gradient"});
      return;
    }
    if (cfg.type === "color") {
      body.style.backgroundImage = "none";
      body.style.backgroundColor = cfg.value;
      if (persist) save(cfg);
      return;
    }
    if (cfg.type === "image") {
      body.classList.add("has-custom-bg");
      body.style.backgroundImage = `url("${cfg.value}")`;
      if (persist) save(cfg);
    }
  }

  function save(cfg) {
    try {
      localStorage.setItem(KEY, JSON.stringify(cfg));
    } catch (e) {
      if (e.name === "QuotaExceededError") {
        toast("Файл слишком большой — фон не сохранён");
      } else {
        toast("Не удалось сохранить фон");
      }
    }
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  inputFile.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) {
      toast("Файл > 4 МБ. Может не поместиться в хранилище.");
    }
    const reader = new FileReader();
    reader.onload = () => {
      applyBackground({type: "image", value: reader.result});
      menu.hidden = true;
    };
    reader.onerror = () => toast("Не удалось прочитать файл");
    reader.readAsDataURL(file);
  });

  inputColor.addEventListener("input", (e) => {
    applyBackground({type: "color", value: e.target.value});
  });

  btnGrad.addEventListener("click", () => {
    applyBackground({type: "gradient"});
    menu.hidden = true;
  });

  btnReset.addEventListener("click", () => {
    applyBackground({type: "color", value: "#0d1117"});
    menu.hidden = true;
  });

  const saved = load();
  if (saved) applyBackground(saved, false);
})();

/* ============================================================
   ГОРЯЧИЕ КЛАВИШИ
   ============================================================ */
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    copyReport();
  }
});

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
renderItems();

// сначала дефолтные баллы (если пользователь их сохранял), потом состояние ввода
loadSavedDefaults();
loadState();

// подписываем кнопки
document.getElementById("btn-copy").addEventListener("click", copyReport);
document.getElementById("btn-csv").addEventListener("click", downloadCSV);
document.getElementById("btn-save").addEventListener("click", saveDefaults);
document.getElementById("btn-reset").addEventListener("click", resetAll);

recalc();
</script>
</body>
